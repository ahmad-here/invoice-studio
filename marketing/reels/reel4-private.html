<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="engine.css">
<style>
  .lines { left: 70px; top: 300px; }
  .lines div { font-size: 120px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.05; }
  .phone { left: 290px; top: 640px; width: 500px; height: 960px; border-radius: 70px; background: #111827; padding: 22px; box-shadow: 0 40px 90px -30px rgba(16,24,40,.6); }
  .screen { width: 100%; height: 100%; border-radius: 52px; background: var(--bg); overflow: hidden; position: relative; }
  .bar { height: 110px; background: #fff; border-bottom: 2px solid var(--line); display: flex; align-items: center; padding: 0 30px; font-size: 30px; font-weight: 800; gap: 14px; }
  .bar i { width: 46px; height: 46px; border-radius: 12px; background: var(--blue); display: inline-block; }
  .blk { margin: 24px 28px 0; height: 120px; border-radius: 22px; background: #fff; box-shadow: 0 6px 16px -8px rgba(16,24,40,.2); }
  .blk.blue { background: var(--blue); height: 200px; }
  .badge { position: absolute; width: 230px; height: 230px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 50px -14px rgba(16,24,40,.4); }
  .b-lock { left: 760px; top: 760px; background: #fff; }
  .b-cloud { left: 60px; top: 1050px; background: #fff; }
  .b-wifi { left: 760px; top: 1250px; background: #fff; }
  .cap { left: 70px; right: 130px; top: 300px; }
  .prog { left: 340px; top: 1300px; width: 400px; height: 26px; border-radius: 99px; background: #dfe7f1; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
  .apk { left: 160px; top: 1270px; width: 760px; display: flex; align-items: center; gap: 26px; padding: 30px 36px; border-radius: 32px; font-size: 40px; font-weight: 800; }
  .apk .ic { width: 110px; height: 110px; border-radius: 26px; background: var(--blue); display:flex; align-items:center; justify-content:center; }
  .apk small { display: block; font-size: 30px; font-weight: 500; color: var(--muted); }
</style></head>
<body><div class="stage grid-bg">
  <div class="lines abs" id="hook"><div id="l0">No sign-up.</div><div id="l1">No cloud.</div><div id="l2" class="blue">No catch.</div></div>
  <div class="phone abs" id="ph"><div class="screen"><div class="bar"><i></i>Invoice Studio</div><div class="blk blue"></div><div class="blk"></div><div class="blk"></div><div class="blk" style="height:90px"></div></div></div>
  <div class="badge b-lock" id="lock"><svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#0692F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <div class="badge b-cloud" id="cloud"><svg width="130" height="130" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"><path d="M17.5 19H8a5 5 0 1 1 1.6-9.7A6 6 0 0 1 21 12.5 3.5 3.5 0 0 1 17.5 19Z"/><path id="strike" d="M3 3l18 18" stroke="#BB2631" stroke-width="2.4" pathLength="1" stroke-dasharray="1"/></svg></div>
  <div class="badge b-wifi" id="wifi"><svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16.2a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1" fill="#6B7280"/><path id="wstrike" d="M3 3l18 18" stroke="#BB2631" stroke-width="2.4" pathLength="1" stroke-dasharray="1"/></svg></div>
  <div class="headline h3 abs cap" id="c1">Your invoices stay <span class="blue">on your device.</span></div>
  <div class="headline h3 abs cap" id="c2">Nothing is <span class="blue">uploaded.</span> Ever.</div>
  <div class="headline h3 abs cap" id="c3">No internet? <span class="blue">Still works.</span></div>
  <div class="prog abs" id="prog"><i id="pi"></i></div>
  <div class="headline h3 abs cap" id="c4">Get the <span class="blue">Android app</span> — or install from your browser.</div>
  <div class="apk card abs" id="apk"><span class="ic"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></span><span>Invoice Studio for Android<small>Free APK · works offline</small></span></div>
  <div class="apk card abs" id="pwa"><span class="ic" style="background:#EAF5FF"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#0692F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg></span><span>Or install from your browser<small>iPhone · Android · Windows · Mac</small></span></div>
</div>
<script src="engine.js"></script><script src="endcard.js"></script>
<script>
injectEnd('Private, offline invoicing.', ['No account', 'No cloud', 'Android & web'])
window.DURATION = 21
const { p, win, tf, words, $, lerp, endCard } = M
window.scene = (t) => {
  ;['l0', 'l1', 'l2'].forEach((id, i) => tf($('#' + id), { x: (1 - p(t, 0.1 + i * 0.5, 0.5, 'back')) * -200, o: Math.min(p(t, 0.1 + i * 0.5, 0.3), 1 - p(t, 2.9, 0.35, 'in')) }))
  const phIn = p(t, 3.1, 0.8, 'back'), phOut = p(t, 13.7, 0.4, 'in')
  tf($('#ph'), { y: (1 - phIn) * 500, o: Math.min(p(t, 3.1, 0.3), 1 - phOut) })
  words($('#c1'), t, 3.3, { stagger: 0.07, out: 6.3 })
  tf($('#lock'), { s: p(t, 4.0, 0.7, 'elastic'), o: Math.min(p(t, 4.0, 0.2), 1 - phOut) })
  words($('#c2'), t, 6.4, { stagger: 0.07, out: 9.4 })
  tf($('#cloud'), { s: p(t, 6.7, 0.7, 'elastic'), o: Math.min(p(t, 6.7, 0.2), 1 - phOut) })
  $('#strike').style.strokeDashoffset = String(1 - p(t, 7.4, 0.5))
  words($('#c3'), t, 9.5, { stagger: 0.07, out: 13.6 })
  tf($('#wifi'), { s: p(t, 9.8, 0.7, 'elastic'), o: Math.min(p(t, 9.8, 0.2), 1 - phOut) })
  $('#wstrike').style.strokeDashoffset = String(1 - p(t, 10.4, 0.5))
  tf($('#prog'), { o: Math.min(p(t, 10.8, 0.3), 1 - p(t, 13.4, 0.3)) })
  $('#pi').style.width = `${p(t, 11.0, 2.0, 'inOut') * 100}%`
  words($('#c4'), t, 13.9, { stagger: 0.06, out: 17.0 })
  tf($('#apk'), { y: (1 - p(t, 14.4, 0.6, 'back')) * 160 - 420, o: Math.min(p(t, 14.4, 0.3), 1 - p(t, 16.9, 0.3)) })
  tf($('#pwa'), { y: (1 - p(t, 14.9, 0.6, 'back')) * 160 - 180, o: Math.min(p(t, 14.9, 0.3), 1 - p(t, 16.9, 0.3)) })
  endCard(t, 17)
}
</script></body></html>
